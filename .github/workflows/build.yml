name: Build (Windows + Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.rel.outputs.release }}
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob diese Version schon veröffentlicht ist
        id: rel
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "Neue Version $VER → Release wird erstellt"
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Version setzen
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Windows-EXE bauen (Installer + portable)
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AleNote-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Version setzen
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Web-Dateien ins Android-Projekt kopieren
        run: npx cap sync android
      - name: Eigenen Signaturschlüssel verwenden (falls als Secret hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.ALENOTE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ALENOTE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: APK bauen
        working-directory: android
        env:
          ALENOTE_KEYSTORE_PASSWORD: ${{ secrets.ALENOTE_KEYSTORE_PASSWORD }}
          ALENOTE_KEY_ALIAS: ${{ secrets.ALENOTE_KEY_ALIAS }}
          ALENOTE_KEY_PASSWORD: ${{ secrets.ALENOTE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: APK benennen und Update-Info erzeugen
        env:
          HAS_KEY: ${{ secrets.ALENOTE_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Kein Signaturschlüssel hinterlegt (Secret ALENOTE_KEYSTORE_BASE64) – Test-APK wird nicht veröffentlicht."
            mkdir -p dist-android
            cp android/app/build/outputs/apk/release/app-release.apk "dist-android/AleNote-${{ needs.prepare.outputs.version }}-test.apk"
            exit 0
          fi
          VER="${{ needs.prepare.outputs.version }}"
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk "dist-android/AleNote-$VER.apk"
          SHA=$(sha256sum "dist-android/AleNote-$VER.apk" | cut -d' ' -f1)
          SIZE=$(stat -c %s "dist-android/AleNote-$VER.apk")
          printf '{\n  "version": "%s",\n  "file": "AleNote-%s.apk",\n  "sha256": "%s",\n  "size": %s,\n  "releaseDate": "%s"\n}\n' "$VER" "$VER" "$SHA" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-android/latest-android.json
          cat dist-android/latest-android.json
      - uses: actions/upload-artifact@v4
        with:
          name: AleNote-Android
          path: dist-android/*
          if-no-files-found: error

  release:
    needs: [prepare, windows, android]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AleNote ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
            out/AleNote-*[0-9].apk
            out/latest-android.json
